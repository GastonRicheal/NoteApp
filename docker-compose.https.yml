services:
  web:
    # Compose merges ports across files; explicitly clear the base HTTP port.
    ports: !reset []
    expose:
      - "5000"

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
