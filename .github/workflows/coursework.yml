name: Coursework checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the submission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate ephemeral test keys
        run: |
          python3 scripts/generate_comment_key.py
          python3 scripts/generate_export_hmac_key.py
          python3 scripts/generate_jwt_key.py
      - name: Build and start the course app
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Verify health and replay the Class 6, Class 8 and Class 9 attacks
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/healthz
          # These replay the two Class 6 forgeries, the Class 8 cross-account
          # read and the Class 9 SQL and command injections against the running
          # app. Each exits non-zero unless every observed status matches the
          # repaired build, so a regression in a verifier or in an input handler
          # fails the build.
          python3 class06/replay/attack.py --base http://localhost:8080 --expect fixed
          python3 class08/replay/permissions.py --base http://localhost:8080 --expect fixed
          python3 class09/replay/injection.py --base http://localhost:8080 --expect fixed
      - name: Run coursework regression tests
        run: |
          docker compose exec -T -e NOTESAPP_TEST_DB=1 web python -m unittest discover -s tests -v
          docker compose exec -T web python migrate_comments.py --dry-run
      - name: Generate a temporary course certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout nginx/certs/notesapp.key -out nginx/certs/notesapp.crt -subj "/CN=localhost"
      - name: Verify the HTTPS entrance and removal of direct HTTP
        run: |
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --wait --wait-timeout 90
          docker compose -f docker-compose.yml -f docker-compose.https.yml exec -T nginx nginx -t
          curl --insecure --fail --retry 10 --retry-connrefused --retry-delay 1 https://localhost/healthz
          if curl --silent --max-time 3 --output /dev/null http://localhost:8080/healthz; then
            echo "The direct HTTP entrance is still reachable."
            exit 1
          fi
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.https.yml logs --no-color
      - name: Stop the isolated CI stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.https.yml down
